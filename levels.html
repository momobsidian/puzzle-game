<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#172e1d">
<title>Select Level - Image Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --felt: #2a5035;
    --felt-light: #366143;
    --felt-dark: #172e1d;
    --wood: #5c3a21;
    --wood-dark: #3b2210;
    --wood-light: #7a4e2d;
    --gold: #ffd700;
    --gold-light: #f7dfa5;
    --gold-mid: #e0b753;
    --gold-shadow: #9c7722;
    --silver: #e0e0e0;
    --silver-mid: #a3a3a3;
    --silver-shadow: #7a7a7a;
    --text-dark: #4a2e1a;
    --text-light: #fff;
    --text-dim: #d4c5a9;
    --text-faint: #8a7560;
    --inset-bg: rgba(0,0,0,0.35);
    --game-font: 'Fredoka One', 'Trebuchet MS', cursive;
    --body-font: 'Nunito', 'Trebuchet MS', Arial, sans-serif;
  }

  html, body {
    min-height: 100%;
    margin: 0; padding: 0;
    background-color: var(--felt);
    background-image: radial-gradient(circle at center, var(--felt-light) 0%, var(--felt-dark) 100%);
    font-family: var(--body-font);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    padding: max(0px, env(safe-area-inset-top)) max(0px, env(safe-area-inset-right)) max(0px, env(safe-area-inset-bottom)) max(0px, env(safe-area-inset-left));
  }

  /* ── Sticky header (Wood panel) ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background-color: var(--wood-dark);
    background-image: repeating-linear-gradient(
      45deg,
      rgba(0,0,0,0.12),
      rgba(0,0,0,0.12) 8px,
      transparent 8px,
      transparent 16px
    );
    border-bottom: 3px solid var(--gold-shadow);
    padding: 10px 16px 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5), 0 1px 0 rgba(255,215,0,0.1);
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  /* ── 3D Back Button ── */
  .back-button {
    background: linear-gradient(to bottom, var(--silver), var(--silver-mid));
    border: none;
    border-radius: 8px;
    color: #333;
    padding: 8px 16px;
    font-family: var(--game-font);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.06em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    box-shadow: 0 4px 0 var(--silver-shadow), 0 6px 12px rgba(0,0,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
  }
  .back-button:hover {
    background: linear-gradient(to bottom, #eee, #b8b8b8);
  }
  .back-button:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--silver-shadow), 0 2px 4px rgba(0,0,0,0.3);
  }

  .header-title-block { text-align: right; }

  h1 {
    font-family: var(--game-font);
    font-size: 26px;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.04em;
    color: var(--gold);
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 2px 2px 0px var(--gold-shadow), 0 3px 8px rgba(0,0,0,0.6);
  }
  .header-sub {
    font-family: var(--body-font);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--gold-mid);
    text-transform: uppercase;
    margin-top: 2px;
    font-weight: 700;
  }

  /* ── Gold Progress bar ── */
  .progress-bar-container {
    height: 4px;
    background: rgba(0,0,0,0.5);
    width: 100%;
    overflow: hidden;
    border-radius: 2px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, var(--gold-shadow), var(--gold), var(--gold-mid));
    transition: width 0.4s ease;
    box-shadow: 0 0 8px rgba(255,215,0,0.4);
  }

  /* ── Progress label ── */
  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0 10px;
    font-family: var(--body-font);
    font-size: 10px;
    color: var(--gold-mid);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }

  /* ── Grid ── */
  .container { padding: 16px 12px 80px; }

  .levels-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    padding: 16px 0;
  }

  /* ── Level Card (3D Wood Style) ── */
  .level-card {
    background-color: var(--wood);
    background-image: repeating-linear-gradient(
      45deg,
      rgba(0,0,0,0.06),
      rgba(0,0,0,0.06) 6px,
      transparent 6px,
      transparent 12px
    );
    border: 2px solid var(--wood-light);
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    aspect-ratio: 1/1;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 4px 0 var(--wood-dark),
      0 6px 12px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .level-card:hover {
    border-color: var(--gold-mid);
    transform: translateY(-2px);
    box-shadow:
      0 6px 0 var(--wood-dark),
      0 10px 20px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .level-card:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--wood-dark), 0 2px 6px rgba(0,0,0,0.3);
  }

  .level-card.completed {
    border-color: var(--gold-shadow);
  }
  .level-card.completed .level-preview { opacity: 0.85; }

  .level-card.skipped {
    border-color: rgba(255,255,255,0.15);
    opacity: 0.8;
  }
  .level-card.skipped .level-preview { opacity: 0.5; }

  /* ── Number area ── */
  .level-preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: var(--inset-bg);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
  }

  .level-icon {
    font-family: var(--game-font);
    font-size: clamp(18px, 5vw, 36px);
    font-weight: 400;
    color: var(--text-light);
    user-select: none;
    line-height: 1;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
  }

  /* ── Label bar ── */
  .level-info {
    border-top: 1px solid rgba(0,0,0,0.4);
    padding: 4px 5px;
    background: rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .level-number {
    font-family: var(--body-font);
    font-size: 8px;
    font-weight: 800;
    color: var(--gold-mid);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  .level-status {
    font-size: 7px;
    color: var(--gold);
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 2px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .status-icon { display: flex; align-items: center; }

  /* ── Lock ── */
  .locked {
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }
  .locked-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .locked-icon { display: flex; align-items: center; color: var(--gold-mid); }

  /* ── PLAY / RESUME badge ── */
  .unlock-next {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to bottom, var(--gold-light), var(--gold-mid));
    color: var(--text-dark);
    padding: 4px 5px;
    font-family: var(--game-font);
    font-size: 10px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    line-height: 1;
    box-shadow: 0 -1px 0 rgba(255,255,255,0.2);
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .unlock-next.resume {
    background: linear-gradient(to bottom, var(--silver), var(--silver-mid));
    color: #333;
  }

  /* ── Unlock notification ── */
  .unlock-notification {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background-color: var(--wood);
    background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.08), rgba(0,0,0,0.08) 8px, transparent 8px, transparent 16px);
    border: 3px solid var(--gold);
    border-radius: 12px;
    padding: 32px 44px;
    z-index: 10000;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 0 0 8px var(--wood-dark), 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(255,215,0,0.2);
  }
  .unlock-notification.show { animation: unlockPop 3s ease-out forwards; }
  @keyframes unlockPop {
    0%   { opacity: 0; transform: translate(-50%, -48%) scale(0.9); }
    10%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    85%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -52%) scale(0.95); }
  }
  .unlock-icon { margin-bottom: 14px; color: var(--gold); }
  .unlock-text {
    font-family: var(--game-font);
    font-size: 24px;
    color: var(--gold);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-shadow: 2px 2px 0 var(--gold-shadow);
  }
  .unlock-subtext {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--body-font);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.8;
    margin-top: 8px;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    font-family: var(--game-font);
    color: var(--gold-mid);
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    text-shadow: 2px 2px 0 var(--gold-shadow);
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .levels-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    h1 { font-size: 22px; }
  }
  @media (max-width: 480px) {
    .levels-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .container { padding: 12px 8px 80px; }
    .header { padding: 8px 10px 0; }
    .progress-label { padding: 4px 0 8px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <button class="back-button" onclick="location.href='index.html'">
        <i data-lucide="arrow-left" style="width: 13px; height: 13px;"></i> Back
      </button>
      <div class="header-title-block">
        <h1>Levels</h1>
        <div class="header-sub">Select a puzzle</div>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar" style="width: 0%"></div>
    </div>
    <div class="progress-label">
      <span id="progressText">0 / 0 Complete</span>
    </div>
  </div>

  <div class="container">
    <div id="levelsContainer" class="loading">Loading levels...</div>
  </div>

  <!-- Unlock notification -->
  <div id="unlockNotification" class="unlock-notification">
    <div class="unlock-icon"><i data-lucide="unlock" style="width: 48px; height: 48px;"></i></div>
    <div class="unlock-text" id="unlockText">Level Unlocked!</div>
    <div class="unlock-subtext" id="unlockSubtext">Keep going!</div>
  </div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
(async function() {
  lucide.createIcons();
  const levelsContainer = document.getElementById('levelsContainer');
  const unlockNotification = document.getElementById('unlockNotification');
  const unlockText = document.getElementById('unlockText');

  // Check if coming from completing a level
  function checkForNewUnlock() {
    const params = new URLSearchParams(window.location.search);
    const unlockedLevel = params.get('unlocked');
    
    if (unlockedLevel) {
      // Show unlock notification
      unlockText.textContent = `Level ${unlockedLevel} Unlocked!`;
      unlockNotification.classList.add('show');
      
      // Clean URL
      window.history.replaceState({}, '', 'levels.html');
      
      // Remove notification class after animation
      setTimeout(() => {
        unlockNotification.classList.remove('show');
      }, 3000);
      
      return parseInt(unlockedLevel, 10);
    }
    return null;
  }
  
  const unlockedLevelTarget = checkForNewUnlock();

  // Fetch progress data
  async function getProgress() {
    try {
      const response = await fetch('/api/progress');
      return await response.json();
    } catch (err) {
      console.error('Error loading progress:', err);
      return { levels: {} };
    }
  }

  // Fetch available images
  async function getImages() {
    try {
      const response = await fetch('/api/levels');
      return await response.json();
    } catch (err) {
      console.error('Error loading levels:', err);
      return { levels: [] };
    }
  }

  // Check if a level is unlocked
  function isLevelUnlocked(levelNum, progress) {
    // Level 1 is always unlocked
    if (levelNum === 1) return true;
    
    // Check if previous level is completed
    const prevLevel = progress.levels[levelNum - 1];
    return prevLevel && prevLevel.completed === true;
  }

  // Check if this is the next unlockable level
  function isNextToUnlock(levelNum, progress) {
    if (levelNum === 1) return false; // Level 1 is already unlocked
    
    const thisLevelUnlocked = isLevelUnlocked(levelNum, progress);
    const thisLevelCompleted = progress.levels[levelNum]?.completed || false;
    
    // It's next to unlock if: current level is unlocked but not completed
    return thisLevelUnlocked && !thisLevelCompleted;
  }

  // Check if level has in-progress game
  function hasInProgressGame(levelNum, progress) {
    return progress.levels[levelNum]?.inProgress !== undefined;
  }

  // Render levels
  async function renderLevels() {
    const progress = await getProgress();
    const imagesData = await getImages();
    
    if (!imagesData.levels || imagesData.levels.length === 0) {
      levelsContainer.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:40px">No levels found. Please add images to the "images" folder.</p>';
      return;
    }

    levelsContainer.className = 'levels-grid';
    levelsContainer.innerHTML = '';

    let completedCount = 0;
    const totalLevels = imagesData.levels.length;
    let targetScrollLevel = unlockedLevelTarget || null;

    imagesData.levels.forEach((level, index) => {
      const levelNum = index + 1;
      const levelProgress = progress.levels[levelNum] || {};
      const isCompleted = levelProgress.completed || false;
      const isSkipped = levelProgress.skipped || false;
      const isLocked = !isLevelUnlocked(levelNum, progress);
      const isNext = isNextToUnlock(levelNum, progress);
      const hasProgress = hasInProgressGame(levelNum, progress);

      if (isCompleted) completedCount++;

      // Figure out what to scroll to if we didn't just unlock something
      if (!targetScrollLevel && !isLocked) {
        if (hasProgress && !isCompleted) {
          targetScrollLevel = levelNum; // Priority 1: In progress game
        } else if (isNext) {
          targetScrollLevel = levelNum; // Priority 2: Next up to play
        }
      }

      const card = document.createElement('div');
      card.id = `level-card-${levelNum}`;
      card.className = 'level-card'
        + (isCompleted && !isSkipped ? ' completed' : '')
        + (isSkipped ? ' skipped' : '')
        + (isLocked ? ' locked' : '');
      
      if (!isLocked) {
        card.onclick = () => location.href = `game.html?level=${levelNum}`;
      }

      card.innerHTML = `
        ${isNext && !hasProgress ? '<div class="unlock-next"><i data-lucide="play" style="width: 9px; height: 9px; display: inline-block; vertical-align: middle;"></i> PLAY</div>' : ''}
        ${hasProgress && !isCompleted ? '<div class="unlock-next resume"><i data-lucide="pause" style="width: 9px; height: 9px; display: inline-block; vertical-align: middle;"></i> RESUME</div>' : ''}
        ${isLocked ? '<div class="locked-overlay"><div class="locked-icon"><i data-lucide="lock" style="width: 22px; height: 22px;"></i></div></div>' : ''}
        <div class="level-preview">
          <div class="level-icon">
            ${isSkipped ? '<i data-lucide="skip-forward" style="width: 22px; height: 22px; opacity: 0.5;"></i>' :
              isCompleted ? '<i data-lucide="check" style="width: 26px; height: 26px; color: var(--gold);"></i>' : levelNum}
          </div>
        </div>
        <div class="level-info">
          <div class="level-number">Lvl ${levelNum}</div>
          ${isCompleted && !isSkipped ? 
            `<div class="level-status">
              <span class="status-icon"><i data-lucide="check" style="width: 10px; height: 10px;"></i></span> DONE
            </div>` : 
            ''
          }
          ${isSkipped ? 
            `<div class="level-status" style="color: var(--text-faint);">
              <span class="status-icon"><i data-lucide="skip-forward" style="width: 10px; height: 10px;"></i></span> SKIP
            </div>` : 
            ''
          }
        </div>
      `;

      levelsContainer.appendChild(card);
    });

    // Update progress bar
    const progressPercent = (completedCount / totalLevels) * 100;
    document.getElementById('progressBar').style.width = progressPercent + '%';
    
    const skippedCount = imagesData.levels.filter((_, i) => {
      const lp = progress.levels[i + 1] || {};
      return lp.completed && lp.skipped;
    }).length;
    const solvedCount = completedCount - skippedCount;
    
    let progressLabel = `${solvedCount} / ${totalLevels} Complete`;
    if (skippedCount > 0) progressLabel += ` · ${skippedCount} Skipped`;
    document.getElementById('progressText').textContent = progressLabel;
    
    // Re-initialize icons since we dynamically added HTML containing <i data-lucide> tags
    lucide.createIcons();
    
    // Auto-scroll to latest relevant level
    if (targetScrollLevel) {
      setTimeout(() => {
        const el = document.getElementById(`level-card-${targetScrollLevel}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  renderLevels();
})();
</script>
</body>
</html>
