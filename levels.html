<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Select Level - Image Puzzle</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-2: #111111;
    --border: #333333;
    --border-soft: #1a1a1a;
    --text: #ffffff;
    --text-dim: #888888;
    --text-faint: #444444;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Consolas", monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  
  html, body {
    min-height: 100%;
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    padding: max(0px, env(safe-area-inset-top)) max(0px, env(safe-area-inset-right)) max(0px, env(safe-area-inset-bottom)) max(0px, env(safe-area-inset-left));
  }

  /* ── Sticky header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
    padding: 12px 20px 0;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .back-button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--mono);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
  }
  .back-button:hover { background: var(--text); color: var(--bg); }
  .back-button:active { opacity: 0.75; }

  .header-title-block { text-align: right; }

  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
    text-transform: uppercase;
  }
  .header-sub {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── Progress bar (flush to header bottom) ── */
  .progress-bar-container {
    height: 2px;
    background: var(--surface-2);
    width: 100%;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--text);
    transition: width 0.4s ease;
  }

  /* ── Progress label ── */
  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 20px 12px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  /* ── Grid ── */
  .container { padding: 0 12px 80px; }

  .levels-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 16px 0;
  }

  /* ── Card ── */
  .level-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    aspect-ratio: 1/1;
    display: flex;
    flex-direction: column;
    transition: border-color 0.12s;
  }
  .level-card:hover { border-color: var(--border); }
  .level-card:active { opacity: 0.8; }

  .level-card.completed {
    border-color: var(--border);
    background: var(--surface);
  }
  .level-card.completed .level-preview { opacity: 0.7; }

  .level-card.skipped {
    border-color: var(--border-soft);
    background: var(--surface);
  }
  .level-card.skipped .level-preview { opacity: 0.4; }

  /* ── Number area ── */
  .level-preview {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .level-icon {
    font-size: clamp(20px, 5vw, 40px);
    font-weight: 900;
    font-family: var(--mono);
    color: var(--text);
    user-select: none;
    line-height: 1;
  }

  /* ── Label bar ── */
  .level-info {
    border-top: 1px solid var(--border-soft);
    padding: 5px 6px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .level-number {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }
  .level-status {
    font-size: 8px;
    color: var(--text);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 3px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .status-icon { display: flex; align-items: center; }

  /* ── Lock ── */
  .locked {
    opacity: 0.25;
    cursor: not-allowed;
    pointer-events: none;
  }
  .locked-overlay {
    position: absolute;
    inset: 0;
    background: var(--bg);
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
  }
  .locked-icon { display: flex; align-items: center; }

  /* ── PLAY / RESUME badge ── */
  .unlock-next {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--text);
    color: var(--bg);
    padding: 5px 6px;
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    line-height: 1;
  }
  .unlock-next.resume {
    background: var(--surface-2);
    color: var(--text);
    border-top: 1px solid var(--border);
  }

  /* ── Unlock notification ── */
  .unlock-notification {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--text);
    border: 1px solid var(--bg);
    padding: 32px 48px;
    z-index: 10000;
    text-align: center;
    opacity: 0;
    pointer-events: none;
  }
  .unlock-notification.show { animation: unlockPop 3s ease-out forwards; }
  @keyframes unlockPop {
    0%   { opacity: 0; transform: translate(-50%, -48%); }
    10%  { opacity: 1; transform: translate(-50%, -50%); }
    85%  { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -52%); }
  }
  .unlock-icon { margin-bottom: 14px; color: var(--bg); }
  .unlock-text {
    font-size: 20px; font-weight: 900; color: var(--bg);
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .unlock-subtext {
    font-size: 11px; color: var(--bg); font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.12em;
    opacity: 0.6; margin-top: 6px;
  }

  .loading {
    text-align: center; padding: 60px 20px;
    font-family: var(--mono); color: var(--text-dim);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .levels-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    h1 { font-size: 20px; }
  }
  @media (max-width: 480px) {
    .levels-grid { grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .container { padding: 0 8px 80px; }
    .header { padding: 10px 12px 0; }
    .progress-label { padding: 5px 12px 10px; }
    h1 { font-size: 18px; }
  }

</style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <button class="back-button" onclick="location.href='index.html'">
        <i data-lucide="arrow-left" style="width: 12px; height: 12px;"></i> Back
      </button>
      <div class="header-title-block">
        <h1>Levels</h1>
        <div class="header-sub">Select a puzzle</div>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar" style="width: 0%"></div>
    </div>
    <div class="progress-label">
      <span id="progressText">0 / 0 Complete</span>
    </div>
  </div>

  <div class="container">
    <div id="levelsContainer" class="loading">Loading levels...</div>
  </div>

  <!-- Unlock notification -->
  <div id="unlockNotification" class="unlock-notification">
    <div class="unlock-icon"><i data-lucide="unlock" style="width: 48px; height: 48px;"></i></div>
    <div class="unlock-text" id="unlockText">Level Unlocked!</div>
    <div class="unlock-subtext" id="unlockSubtext">Keep going!</div>
  </div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
(async function() {
  lucide.createIcons();
  const levelsContainer = document.getElementById('levelsContainer');
  const unlockNotification = document.getElementById('unlockNotification');
  const unlockText = document.getElementById('unlockText');

  // Check if coming from completing a level
  function checkForNewUnlock() {
    const params = new URLSearchParams(window.location.search);
    const unlockedLevel = params.get('unlocked');
    
    if (unlockedLevel) {
      // Show unlock notification
      unlockText.textContent = `Level ${unlockedLevel} Unlocked!`;
      unlockNotification.classList.add('show');
      
      // Clean URL
      window.history.replaceState({}, '', 'levels.html');
      
      // Remove notification class after animation
      setTimeout(() => {
        unlockNotification.classList.remove('show');
      }, 3000);
      
      return parseInt(unlockedLevel, 10);
    }
    return null;
  }
  
  const unlockedLevelTarget = checkForNewUnlock();

  // Fetch progress data
  async function getProgress() {
    try {
      const response = await fetch('/api/progress');
      return await response.json();
    } catch (err) {
      console.error('Error loading progress:', err);
      return { levels: {} };
    }
  }

  // Fetch available images
  async function getImages() {
    try {
      const response = await fetch('/api/levels');
      return await response.json();
    } catch (err) {
      console.error('Error loading levels:', err);
      return { levels: [] };
    }
  }

  // Check if a level is unlocked
  function isLevelUnlocked(levelNum, progress) {
    // Level 1 is always unlocked
    if (levelNum === 1) return true;
    
    // Check if previous level is completed
    const prevLevel = progress.levels[levelNum - 1];
    return prevLevel && prevLevel.completed === true;
  }

  // Check if this is the next unlockable level
  function isNextToUnlock(levelNum, progress) {
    if (levelNum === 1) return false; // Level 1 is already unlocked
    
    const thisLevelUnlocked = isLevelUnlocked(levelNum, progress);
    const thisLevelCompleted = progress.levels[levelNum]?.completed || false;
    
    // It's next to unlock if: current level is unlocked but not completed
    return thisLevelUnlocked && !thisLevelCompleted;
  }

  // Check if level has in-progress game
  function hasInProgressGame(levelNum, progress) {
    return progress.levels[levelNum]?.inProgress !== undefined;
  }

  // Render levels
  async function renderLevels() {
    const progress = await getProgress();
    const imagesData = await getImages();
    
    if (!imagesData.levels || imagesData.levels.length === 0) {
      levelsContainer.innerHTML = '<p>No levels found. Please add images to the "images" folder.</p>';
      return;
    }

    levelsContainer.className = 'levels-grid';
    levelsContainer.innerHTML = '';

    let completedCount = 0;
    const totalLevels = imagesData.levels.length;
    let targetScrollLevel = unlockedLevelTarget || null;

    imagesData.levels.forEach((level, index) => {
      const levelNum = index + 1;
      const levelProgress = progress.levels[levelNum] || {};
      const isCompleted = levelProgress.completed || false;
      const isSkipped = levelProgress.skipped || false;
      const isLocked = !isLevelUnlocked(levelNum, progress);
      const isNext = isNextToUnlock(levelNum, progress);
      const hasProgress = hasInProgressGame(levelNum, progress);

      if (isCompleted) completedCount++;

      // Figure out what to scroll to if we didn't just unlock something
      if (!targetScrollLevel && !isLocked) {
        if (hasProgress && !isCompleted) {
          targetScrollLevel = levelNum; // Priority 1: In progress game
        } else if (isNext) {
          targetScrollLevel = levelNum; // Priority 2: Next up to play
        }
      }

      const card = document.createElement('div');
      card.id = `level-card-${levelNum}`;
      card.className = 'level-card'
        + (isCompleted && !isSkipped ? ' completed' : '')
        + (isSkipped ? ' skipped' : '')
        + (isLocked ? ' locked' : '');
      
      if (!isLocked) {
        card.onclick = () => location.href = `game.html?level=${levelNum}`;
      }

      card.innerHTML = `
        ${isNext && !hasProgress ? '<div class="unlock-next"><i data-lucide="play" style="width: 10px; height: 10px; display: inline-block; vertical-align: middle;"></i> PLAY</div>' : ''}
        ${hasProgress && !isCompleted ? '<div class="unlock-next resume"><i data-lucide="pause" style="width: 10px; height: 10px; display: inline-block; vertical-align: middle;"></i> RESUME</div>' : ''}
        ${isLocked ? '<div class="locked-overlay"><div class="locked-icon"><i data-lucide="lock" style="width: 24px; height: 24px;"></i></div></div>' : ''}
        <div class="level-preview">
          <div class="level-icon">
            ${isSkipped ? '<i data-lucide="skip-forward" style="width: 24px; height: 24px; opacity: 0.4;"></i>' :
              isCompleted ? '<i data-lucide="check" style="width: 28px; height: 28px;"></i>' : levelNum}
          </div>
        </div>
        <div class="level-info">
          <div class="level-number">Level ${levelNum}</div>
          ${isCompleted && !isSkipped ? 
            `<div class="level-status">
              <span class="status-icon"><i data-lucide="check" style="width: 12px; height: 12px;"></i></span> COMPLETE
            </div>` : 
            ''
          }
          ${isSkipped ? 
            `<div class="level-status" style="color: var(--text-dim);">
              <span class="status-icon"><i data-lucide="skip-forward" style="width: 12px; height: 12px;"></i></span> SKIPPED
            </div>` : 
            ''
          }
        </div>
      `;

      levelsContainer.appendChild(card);
    });

    // Update progress bar
    const progressPercent = (completedCount / totalLevels) * 100;
    document.getElementById('progressBar').style.width = progressPercent + '%';
    
    const skippedCount = imagesData.levels.filter((_, i) => {
      const lp = progress.levels[i + 1] || {};
      return lp.completed && lp.skipped;
    }).length;
    const solvedCount = completedCount - skippedCount;
    
    let progressLabel = `${solvedCount} / ${totalLevels} Complete`;
    if (skippedCount > 0) progressLabel += ` · ${skippedCount} Skipped`;
    document.getElementById('progressText').textContent = progressLabel;
    
    // Re-initialize icons since we dynamically added HTML containing <i data-lucide> tags
    lucide.createIcons();
    
    // Auto-scroll to latest relevant level
    if (targetScrollLevel) {
      setTimeout(() => {
        const el = document.getElementById(`level-card-${targetScrollLevel}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  renderLevels();
})();
</script>
</body>
</html>
